<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 740 1330"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">How revealjs template partials assemble a Quarto presentation</title>
  <desc id="svg-desc">A schematic of the file template.html for format revealjs, drawn as an ordered, top-to-bottom stack inside literal html, head, and body tags. Boxes mark the head and body sections. Inside the head: styles.html, shared with the html format, and a dashed header-includes injection slot. Inside the body: a dashed include-before slot, then a box marking the div with class slides, which holds title-slide.html, toc-slide.html (only if toc is set), and the document body, one section element per slide. After the slides div come the template's literal reveal.js setup scripts, shown as a dotted mark, and last the dashed include-after injection slot, which lands after those scripts. Dotted marks between the boxes indicate the template's literal HTML boilerplate.</desc>

  <rect x="0" y="0" width="740" height="1330" fill="#ececec"/>

  <!-- ===== title ===== -->
  <text x="70" y="108"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="40" font-weight="bold" fill="#222">template.html</text>
  <text x="430" y="108"
        font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="26" fill="#777">format: revealjs</text>

  <!-- ===== template.html container ===== -->
  <rect x="70" y="160" width="600" height="1080" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>

  <!-- literal html tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="26" fill="#555">
    <text x="92" y="204">&lt;html&gt;</text>
    <text x="92" y="1216">&lt;/html&gt;</text>
  </g>

  <!-- ===== head section ===== -->
  <rect x="104" y="224" width="546" height="296" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="26" fill="#555">
    <text x="116" y="258">&lt;head&gt;</text>
    <text x="116" y="502">&lt;/head&gt;</text>
  </g>

  <!-- ===== body section ===== -->
  <rect x="104" y="540" width="546" height="638" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="26" fill="#555">
    <text x="116" y="574">&lt;body&gt;</text>
    <text x="116" y="1160">&lt;/body&gt;</text>
  </g>

  <!-- ===== slides section ===== -->
  <rect x="124" y="648" width="506" height="356" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="26" fill="#555">
    <text x="136" y="682">&lt;div class="slides"&gt;</text>
    <text x="136" y="986">&lt;/div&gt;</text>
  </g>

  <!-- boilerplate markers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="34" font-weight="bold" fill="#999" text-anchor="middle">
    <text x="377" y="296">&#183;&#183;&#183;</text>
    <text x="377" y="466">&#183;&#183;&#183;</text>
    <text x="377" y="1042">&#183;&#183;&#183;</text>
  </g>
  <text x="377" y="1070" font-size="20" font-style="italic" fill="#999" text-anchor="middle"
        font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">reveal.js setup scripts</text>

  <!-- partial cards + injection slots -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">

    <!-- styles.html -->
    <rect x="124" y="312" width="506" height="72" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="146" y="358" font-size="30" fill="#222">styles.html</text>
    <text x="610" y="358" font-size="26" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">shared with html</text>

    <!-- header-includes (injection slot) -->
    <rect x="124" y="400" width="506" height="34" rx="5" fill="#ece9f5" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="146" y="424" font-size="22" font-style="italic" fill="#6a4c93">header-includes</text>

    <!-- include-before (injection slot) -->
    <rect x="124" y="594" width="506" height="34" rx="5" fill="#ece9f5" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="146" y="618" font-size="22" font-style="italic" fill="#6a4c93">include-before</text>

    <!-- title-slide.html -->
    <rect x="144" y="702" width="466" height="72" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="166" y="748" font-size="30" fill="#222">title-slide.html</text>

    <!-- toc-slide.html (conditional) -->
    <rect x="144" y="790" width="466" height="72" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="166" y="822" font-size="30" fill="#222">toc-slide.html</text>
    <text x="166" y="848" font-size="20" font-style="italic" fill="#8a5a00"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">if toc is set</text>

    <!-- $body$ (highlight) -->
    <rect x="144" y="878" width="466" height="72" rx="6" fill="#d8ecea" stroke="#1b7f79" stroke-width="3"/>
    <text x="166" y="924" font-size="30" font-weight="bold" fill="#14625d">$body$</text>
    <text x="590" y="924" font-size="26" fill="#2a6f6a" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">one &lt;section&gt; per slide</text>

    <!-- include-after (injection slot) -->
    <rect x="124" y="1090" width="506" height="34" rx="5" fill="#ece9f5" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="146" y="1114" font-size="22" font-style="italic" fill="#6a4c93">include-after</text>

  </g>

  <!-- ===== legend ===== -->
  <text x="92" y="1292" font-size="34" font-weight="bold" fill="#999"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">&#183;&#183;&#183;</text>
  <text x="170" y="1292"
        font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="24" fill="#444">literal HTML in the template</text>

</svg>
