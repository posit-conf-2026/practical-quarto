<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 510"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Quarto does this for every part</title>
  <desc id="svg-desc">The same figure, with the rest of the template also replaced by amber calls: dollar metadata dot html parens dollar and dollar styles dot html parens dollar in the head, and dollar toc dot html parens dollar beside the title-block call in the body. Only dollar body dollar, in teal, and the literal html, head and body tags remain.</desc>

  <text x="40" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">template.html</text>
  <text x="440" y="34" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">calls other files</text>
  <rect x="40" y="48" width="400" height="404" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#555">
    <text x="66" y="88">&lt;html&gt;</text>
    <text x="66" y="122">&lt;head&gt;</text>
    <text x="66" y="156"><tspan fill="#8a5a00" font-weight="bold">$metadata.html()$</tspan></text>
    <text x="66" y="190"><tspan fill="#8a5a00" font-weight="bold">$styles.html()$</tspan></text>
    <text x="66" y="224">&lt;/head&gt;</text>
    <text x="66" y="258">&lt;body&gt;</text>
    <text x="66" y="292"><tspan fill="#8a5a00" font-weight="bold">$title-block.html()$</tspan></text>
    <text x="66" y="326"><tspan fill="#8a5a00" font-weight="bold">$toc.html()$</tspan></text>
    <text x="66" y="360"><tspan fill="#14625d" font-weight="bold">$body$</tspan></text>
    <text x="66" y="394">&lt;/body&gt;</text>
    <text x="66" y="428">&lt;/html&gt;</text>
  </g>
  <g stroke="#555" stroke-width="3" fill="none">
    <path d="M 440 284 L 560 284 L 560 131 L 618 131"/>
  </g>
  <path d="M 640 131 L 616 120 L 616 142 Z" fill="#555"/>
  <text x="660" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">title-block.html</text>
  <text x="1220" y="34" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">the file it names</text>
  <rect x="660" y="48" width="560" height="166" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#555">
    <text x="686" y="88">&lt;header&gt;</text>
    <text x="686" y="122">  &lt;h1&gt;<tspan fill="#14625d" font-weight="bold">$title$</tspan>&lt;/h1&gt;</text>
    <text x="686" y="156">  &lt;p&gt;<tspan fill="#14625d" font-weight="bold">$author$</tspan>&lt;/p&gt;</text>
    <text x="686" y="190">&lt;/header&gt;</text>
  </g>
  <text x="1196" y="84" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">raw HTML</text>
  <text x="1196" y="118" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#14625d">variables</text>

</svg>
