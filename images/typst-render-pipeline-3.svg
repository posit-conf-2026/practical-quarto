<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 320"
     width="1300" height="320"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">report.qmd through Pandoc to report.typ, then through Typst to report.pdf</title>
  <desc id="svg-desc">Three boxes in a row joined by two labelled arrows. report.qmd on the left, an arrow labelled Pandoc, report.typ in the middle holding grey boilerplate and a teal equals Summary line, an arrow labelled Typst, and report.pdf drawn as a rendered page with a logo mark, a centred title and lines of body text.</desc>

  <text x="40" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">report.qmd</text>
  <text x="370" y="40" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">you write this</text>
  <rect x="40" y="56" width="330" height="238" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#555">
    <text x="64" y="94">---</text>
    <text x="64" y="126">title: "Regional ..."</text>
    <text x="64" y="158">format: typst</text>
    <text x="64" y="190">---</text>
    <text x="64" y="254"><tspan fill="#14625d" font-weight="bold">## Summary</tspan></text>
  </g>

  <text x="425" y="164" text-anchor="middle" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">Pandoc</text>
  <g stroke="#777" stroke-width="4" fill="none">
    <path d="M 370 186 L 462 186"/>
  </g>
  <path d="M 480 186 L 456 175 L 456 197 Z" fill="#777"/>

  <text x="490" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">report.typ</text>
  <rect x="490" y="56" width="330" height="238" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#555">
    <text x="514" y="94">#let brand-color = ...</text>
    <text x="514" y="126">#show: doc =&gt; article(</text>
    <text x="514" y="158">#set page(...)</text>
    <text x="514" y="190">...</text>
    <text x="514" y="254"><tspan fill="#14625d" font-weight="bold">= Summary</tspan></text>
  </g>

  <text x="875" y="164" text-anchor="middle" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">Typst</text>
  <g stroke="#777" stroke-width="4" fill="none">
    <path d="M 820 186 L 912 186"/>
  </g>
  <path d="M 930 186 L 906 175 L 906 197 Z" fill="#777"/>

  <text x="940" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">report.pdf</text>
  <text x="1260" y="40" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">the output</text>
  <rect x="940" y="56" width="320" height="238" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <rect x="966" y="80" width="28" height="28" rx="5" fill="#1B5E4F"/>
  <g fill="#bbb">
    <rect x="1044" y="128" width="112" height="12" rx="6"/>
    <rect x="1068" y="152" width="64" height="8" rx="4"/>
  </g>
  <rect x="966" y="190" width="86" height="12" rx="6" fill="#14625d"/>
  <g fill="#ddd">
    <rect x="966" y="216" width="268" height="8" rx="4"/>
    <rect x="966" y="234" width="268" height="8" rx="4"/>
    <rect x="966" y="252" width="180" height="8" rx="4"/>
  </g>
</svg>
