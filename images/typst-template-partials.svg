<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 740 1080"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">How Typst template partials assemble a Quarto document</title>
  <desc id="svg-desc">A schematic of the file template.typ for format typst, drawn as an ordered, top-to-bottom stack of partial files: numbering.typ (number formats), definitions.typ (helpers), typst-template.typ (defines article()), a dashed header-includes injection slot, page.typ (set page), and typst-show.typ (calls article(doc)). A box labeled passed to article() as doc holds the rest: a dashed include-before injection slot, the document body, notes.typ (footnotes), biblio.typ (bibliography), and a dashed include-after injection slot.</desc>

  <rect x="0" y="0" width="740" height="1080" fill="#ececec"/>

  <!-- ===== title ===== -->
  <text x="70" y="108"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="40" font-weight="bold" fill="#222">template.typ</text>
  <text x="400" y="108"
        font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="26" fill="#777">format: typst</text>

  <!-- ===== template.typ container ===== -->
  <rect x="70" y="160" width="600" height="862" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>

  <!-- ===== doc section ===== -->
  <rect x="104" y="624" width="546" height="372" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <text x="116" y="656" font-size="22" font-style="italic" fill="#888"
        font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">passed to article() as doc</text>

  <!-- partial cards + injection slots -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">

    <!-- numbering.typ -->
    <rect x="104" y="200" width="546" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="126" y="240" font-size="26" fill="#222">numbering.typ</text>
    <text x="630" y="240" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">number formats</text>

    <!-- definitions.typ -->
    <rect x="104" y="274" width="546" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="126" y="314" font-size="26" fill="#222">definitions.typ</text>
    <text x="630" y="314" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">helpers</text>

    <!-- typst-template.typ -->
    <rect x="104" y="348" width="546" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="126" y="388" font-size="26" fill="#222">typst-template.typ</text>
    <text x="630" y="388" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">defines article()</text>

    <!-- header-includes (injection slot) -->
    <rect x="104" y="422" width="546" height="34" rx="5" fill="#ece9f5" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="126" y="446" font-size="22" font-style="italic" fill="#6a4c93">header-includes</text>

    <!-- page.typ -->
    <rect x="104" y="470" width="546" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="126" y="510" font-size="26" fill="#222">page.typ</text>
    <text x="630" y="510" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">#set page()</text>

    <!-- typst-show.typ -->
    <rect x="104" y="544" width="546" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="126" y="584" font-size="26" fill="#222">typst-show.typ</text>
    <text x="630" y="584" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">calls article(doc)</text>

    <!-- include-before (injection slot) -->
    <rect x="124" y="672" width="506" height="34" rx="5" fill="#ece9f5" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="146" y="696" font-size="22" font-style="italic" fill="#6a4c93">include-before</text>

    <!-- $body$ (highlight) -->
    <rect x="124" y="722" width="506" height="60" rx="6" fill="#d8ecea" stroke="#1b7f79" stroke-width="3"/>
    <text x="146" y="762" font-size="26" font-weight="bold" fill="#14625d">$body$</text>
    <text x="610" y="762" font-size="22" fill="#2a6f6a" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">your .qmd, translated</text>

    <!-- notes.typ -->
    <rect x="124" y="796" width="506" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="146" y="836" font-size="26" fill="#222">notes.typ</text>
    <text x="610" y="836" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">footnotes</text>

    <!-- biblio.typ -->
    <rect x="124" y="870" width="506" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="146" y="910" font-size="26" fill="#222">biblio.typ</text>
    <text x="610" y="910" font-size="22" fill="#777" text-anchor="end"
          font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">bibliography</text>

    <!-- include-after (injection slot) -->
    <rect x="124" y="944" width="506" height="34" rx="5" fill="#ece9f5" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="146" y="968" font-size="22" font-style="italic" fill="#6a4c93">include-after</text>

  </g>

</svg>
