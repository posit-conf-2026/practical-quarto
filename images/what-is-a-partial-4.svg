<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 510"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Your file is used instead</title>
  <desc id="svg-desc">The same figure with Quarto's title-block.html box faded to grey and a second box below it drawn with a purple dashed border, labelled title-block.html, yours. It holds the same header element plus an extra paragraph containing the teal dollar subtitle dollar. The connector from the call now points at your box.</desc>

  <text x="40" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">template.html</text>
  <text x="440" y="34" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">calls other files</text>
  <rect x="40" y="48" width="400" height="404" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#555">
    <text x="66" y="88">&lt;html&gt;</text>
    <text x="66" y="122">&lt;head&gt;</text>
    <text x="66" y="156"><tspan fill="#8a5a00" font-weight="bold">$metadata.html()$</tspan></text>
    <text x="66" y="190"><tspan fill="#8a5a00" font-weight="bold">$styles.html()$</tspan></text>
    <text x="66" y="224">&lt;/head&gt;</text>
    <text x="66" y="258">&lt;body&gt;</text>
    <text x="66" y="292"><tspan fill="#8a5a00" font-weight="bold">$title-block.html()$</tspan></text>
    <text x="66" y="326"><tspan fill="#8a5a00" font-weight="bold">$toc.html()$</tspan></text>
    <text x="66" y="360"><tspan fill="#14625d" font-weight="bold">$body$</tspan></text>
    <text x="66" y="394">&lt;/body&gt;</text>
    <text x="66" y="428">&lt;/html&gt;</text>
  </g>
  <g stroke="#6a4c93" stroke-width="3" fill="none">
    <path d="M 440 284 L 560 284 L 560 376 L 618 376"/>
  </g>
  <path d="M 640 376 L 616 365 L 616 387 Z" fill="#6a4c93"/>
  <text x="660" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#aaa">title-block.html</text>
  <text x="1220" y="34" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#aaa">Quarto's</text>
  <rect x="660" y="48" width="560" height="166" rx="10" fill="#f7f7f7" stroke="#ccc" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#aaa">
    <text x="686" y="88">&lt;header&gt;</text>
    <text x="686" y="122">  &lt;h1&gt;$title$&lt;/h1&gt;</text>
    <text x="686" y="156">  &lt;p&gt;$author$&lt;/p&gt;</text>
    <text x="686" y="190">&lt;/header&gt;</text>
  </g>
  <text x="660" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#4a3268">title-block.html</text>
  <text x="1220" y="262" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#6a4c93">yours</text>
  <rect x="660" y="276" width="560" height="200" rx="10" fill="#ece9f5" stroke="#6a4c93" stroke-width="3" stroke-dasharray="7 5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#4a3268">
    <text x="686" y="316">&lt;header&gt;</text>
    <text x="686" y="350">  &lt;h1&gt;<tspan fill="#14625d" font-weight="bold">$title$</tspan>&lt;/h1&gt;</text>
    <text x="686" y="384">  &lt;p&gt;<tspan fill="#14625d" font-weight="bold">$subtitle$</tspan>&lt;/p&gt;</text>
    <text x="686" y="418">  &lt;p&gt;<tspan fill="#14625d" font-weight="bold">$author$</tspan>&lt;/p&gt;</text>
    <text x="686" y="452">&lt;/header&gt;</text>
  </g>

</svg>
