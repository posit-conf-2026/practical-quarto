<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 626"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">A document renders to output</title>
  <desc id="svg-desc">The document on the left, with a connector stepping down from it, labelled render, arrowing into hello.html on the right: a full HTML page of which only two parts are teal, Hello inside the title element and a paragraph reading Hello world. Everything else is grey, and nothing yet explains where it came from.</desc>

  <text x="40" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">hello.qmd</text>
  <text x="430" y="34" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">your content</text>
  <rect x="40" y="48" width="390" height="200" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#555">
    <text x="66" y="88">---</text>
    <text x="66" y="122">title: <tspan fill="#14625d" font-weight="bold">Hello</tspan></text>
    <text x="66" y="156">---</text>
    <text x="66" y="190"></text>
    <text x="66" y="224"><tspan fill="#14625d" font-weight="bold">Hello **world**!</tspan></text>
  </g>
  <g stroke="#777" stroke-width="3" fill="none">
    <path d="M 430 148 L 560 148 L 560 325"/>
    <path d="M 560 325 L 638 325"/>
  </g>
  <path d="M 660 325 L 636 314 L 636 336 Z" fill="#777"/>
  <text x="544" y="332" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">render</text>
  <text x="680" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">hello.html</text>
  <text x="1260" y="160" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">the output</text>
  <rect x="680" y="174" width="580" height="302" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#555">
    <text x="706" y="214">&lt;html&gt;</text>
    <text x="706" y="248">&lt;head&gt;</text>
    <text x="706" y="282">&lt;title&gt;<tspan fill="#14625d" font-weight="bold">Hello</tspan>&lt;/title&gt;</text>
    <text x="706" y="316">&lt;/head&gt;</text>
    <text x="706" y="350">&lt;body&gt;</text>
    <text x="706" y="384"><tspan fill="#14625d" font-weight="bold">&lt;p&gt;Hello &lt;strong&gt;world&lt;/strong&gt;!&lt;/p&gt;</tspan></text>
    <text x="706" y="418">&lt;/body&gt;</text>
    <text x="706" y="452">&lt;/html&gt;</text>
  </g>

</svg>
