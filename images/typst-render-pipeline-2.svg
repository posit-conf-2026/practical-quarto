<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 320"
     width="1300" height="320"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">report.qmd, through Pandoc, becomes report.typ</title>
  <desc id="svg-desc">The report.qmd box on the left, an arrow labelled Pandoc, and a second box labelled report.typ holding grey boilerplate lines — a brand-color definition, a show colon doc arrow article call, a set page call — and then in teal the line equals Summary.</desc>

  <text x="40" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">report.qmd</text>
  <text x="370" y="40" text-anchor="end" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">you write this</text>
  <rect x="40" y="56" width="330" height="238" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#555">
    <text x="64" y="94">---</text>
    <text x="64" y="126">title: "Regional ..."</text>
    <text x="64" y="158">format: typst</text>
    <text x="64" y="190">---</text>
    <text x="64" y="254"><tspan fill="#14625d" font-weight="bold">## Summary</tspan></text>
  </g>

  <text x="425" y="164" text-anchor="middle" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#777">Pandoc</text>
  <g stroke="#777" stroke-width="4" fill="none">
    <path d="M 370 186 L 462 186"/>
  </g>
  <path d="M 480 186 L 456 175 L 456 197 Z" fill="#777"/>

  <text x="490" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#222">report.typ</text>
  <rect x="490" y="56" width="330" height="238" rx="10" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#555">
    <text x="514" y="94">#let brand-color = ...</text>
    <text x="514" y="126">#show: doc =&gt; article(</text>
    <text x="514" y="158">#set page(...)</text>
    <text x="514" y="190">...</text>
    <text x="514" y="254"><tspan fill="#14625d" font-weight="bold">= Summary</tspan></text>
  </g>
</svg>
